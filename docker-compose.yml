# GitHub repository for Portainer / stack metadata
# Source: https://github.com/ImAGhost00/Server-Dash

services:
  backend:
    build:
      context: ./backend
    container_name: spaceship-backend
    ports:
      - "8801:8000"
    restart: unless-stopped
    labels:
      - "org.opencontainers.image.source=https://github.com/ImAGhost00/Server-Dash"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
    container_name: spaceship-frontend
    ports:
      - "8802:80"
    depends_on:
      - backend
    restart: unless-stopped
    labels:
      - "org.opencontainers.image.source=https://github.com/ImAGhost00/Server-Dash"
