services:
  backend:
    build:
      context: ./backend
    container_name: spaceship-backend
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
    container_name: spaceship-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
