<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spaceship Station</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>
    <style>
      :root {
        --bg: #0b0414;
        --panel: #170b28;
        --metal: #4b3866;
        --metal-light: #9b7fc4;
        --accent: #b388ff;
        --warning: #f9c74f;
        --danger: #ff6b6b;
      }

      html, body {
        margin: 0;
        height: 100%;
        background: radial-gradient(circle at top, #1d0f36, #0b0414 55%);
        color: #e6d9ff;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      body {
        display: flex;
        justify-content: center;
        align-items: center;
      }

      #game-shell {
        width: min(92vw, 1400px);
        height: min(86vh, 820px);
        border: 2px solid rgba(179, 136, 255, 0.35);
        background: rgba(11, 4, 20, 0.9);
        box-shadow: 0 0 24px rgba(179, 136, 255, 0.16);
        overflow: hidden;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="game-shell"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
